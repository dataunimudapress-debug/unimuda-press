<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Unimuda Press - Management Portal</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <style>
    body { background-color: #f8f9fa; font-family: 'Inter', sans-serif; color: #191c1d; }
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    .tonal-card { background: white; border: 1px solid #E9ECEF; transition: box-shadow 0.25s ease, transform 0.15s ease; }
    .tonal-card:hover { box-shadow: 0 8px 16px -4px rgba(0, 89, 187, 0.08); }
    .calculation-bar { background-color: #fff9c4; border: 1px solid #fbc02d; }
  </style>
</head>
<body class="text-on-surface">
  <div id="app" class="min-h-screen">
    <!-- Header Navigation -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-50">
      <div class="flex items-center gap-3">
        <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBToZeAfFxyZYmKSGSH38c62UZbCq5wIChepsJesICYKwagjrUhRLZntwJxh6Pj-D7W7kR2Ksmy-d5tDgVsIASmRzIrGAPbf8k_-fHrHhwH0faC3fVX4O9veuL8cXChx0sKhX6s-kSqO_7tYzGKdc42HQy3iREz-Ys1LUBNqCQ5NY4fqIHwaFUHN1sPHzxPHza7dp5hvAIqOu4brE1vV2c0_lIlpkY8oLADWNpqKNTsWHf1YWTr7Fub14of_Z1-wznOPtc" alt="Unimuda Press Logo" class="h-10 w-auto object-contain" />
        <div>
          <h1 class="font-bold text-xl text-[#0059bb]">Unimuda Press</h1>
          <p class="text-xs text-gray-500">Management Portal (Google Apps Script HtmlService)</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="bg-emerald-50 text-emerald-700 font-semibold text-xs px-3 py-1.5 rounded-full border border-emerald-200">Google Apps Script HTML Ready</span>
      </div>
    </header>

    <main class="p-6 max-w-7xl mx-auto">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="tonal-card p-6 rounded-xl border-l-4 border-l-[#0059bb]">
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Penghasilan Hari Ini</p>
          <h3 class="text-2xl font-bold text-gray-900">Rp 4.250.000</h3>
          <p class="text-xs text-emerald-600 mt-2 font-medium">+12.5% dari kemarin</p>
        </div>
        <div class="tonal-card p-6 rounded-xl border-l-4 border-l-[#ffd600]">
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Penghasilan Bulan Ini</p>
          <h3 class="text-2xl font-bold text-gray-900">Rp 128.400.000</h3>
          <p class="text-xs text-blue-600 mt-2 font-medium">+8.2% target bulanan</p>
        </div>
        <div class="tonal-card p-6 rounded-xl border-l-4 border-l-[#800000]">
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Transaksi Belum Lunas</p>
          <h3 class="text-2xl font-bold text-gray-900">14 Order</h3>
          <p class="text-xs text-red-600 mt-2 font-medium">3 Melewati tenggat</p>
        </div>
      </div>

      <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm mb-8">
        <h3 class="font-bold text-lg text-gray-800 mb-4">Input Transaksi Baru</h3>
        <form id="gasForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">Nama Pelanggan</label>
              <input type="text" id="custName" required class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#0059bb]" placeholder="Nama Pelanggan" />
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">Jenis Pesanan</label>
              <select id="orderType" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#0059bb]">
                <option value="Spanduk (Outdoor)">Spanduk (Outdoor)</option>
                <option value="Banner (X-Banner)">Banner (X-Banner)</option>
                <option value="Baliho">Baliho (Large Format)</option>
                <option value="Digital Printing">Digital Printing (A3)</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-bold text-gray-600 mb-1">Total Amount (Rp)</label>
              <input type="number" id="totalAmount" value="150000" class="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-[#0059bb]" />
            </div>
          </div>
          <button type="submit" class="bg-[#0059bb] hover:bg-[#004493] text-white font-bold px-6 py-2.5 rounded-lg text-sm transition-colors">
            Simpan Transaksi Ke Google Sheet
          </button>
        </form>
      </div>
    </main>
  </div>

  <script>
    function handleFormSubmit(e) {
      e.preventDefault();
      const name = document.getElementById('custName').value;
      const type = document.getElementById('orderType').value;
      const amount = document.getElementById('totalAmount').value;

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run.withSuccessHandler(function(res) {
          alert(res.message || 'Berhasil disimpan!');
        }).saveTransaction({ customerName: name, orderType: type, totalAmount: amount });
      } else {
        alert('Disimpan! Data terintegrasi dengan Google Apps Script backend.');
      }
    }
  </script>
</body>
</html>
